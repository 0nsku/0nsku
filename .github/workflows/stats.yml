name: Generate profile graphics

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/stats.yml"
  schedule:
    # Keep the locally saved anime view graphic reasonably fresh without
    # creating a commit for every profile load.
    - cron: "*/30 * * * *"

permissions:
  contents: write

concurrency:
  group: profile-graphics
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Generate SVG graphics
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_LOGIN: ${{ github.repository_owner }}
        run: python3 scripts/generate_stats.py

      - name: Commit updated graphics
        run: |
          if git diff --quiet; then
            echo "No graphics changed."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stats.svg streak.svg langs.svg year.svg views.svg hd-*.svg
          git commit -m "chore: refresh profile graphics"
          git push
